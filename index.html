<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DAWN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png" sizes="32x32">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f4f9;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    h1, h2 {
      color: #4A90E2;
    }

    p {
      font-size: 1.1rem;
      color: #666;
    }

    /* Main video grid */
    .video-grid {
      width: 100%;
      max-width: 98%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      padding: 1rem;
    }

    .video-grid video {
      width: 100%;
      height: auto;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .video-caption {
      text-align: center;
      margin-top: 0.5rem;
      color: #666;
      font-size: 0.9rem;
    }

    /* Content card */
    .content-section {
      padding-top: 2rem;
    }

    .container {
      text-align: center;
      padding: 2rem 3rem;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 95%;
      margin: 0 auto;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }

    /* Small video/image grids */
    .video-grid-small {
      display: grid;
      grid-template-columns: repeat(4, 1fr); /* 4 per row */
      gap: 10px;
      padding: 10px;
    }

    .video-grid-small img,
    .video-grid-small video {
      width: 100%;
      height: auto;
      border-radius: 8px;
      object-fit: cover;
    }

    /* Responsive behavior */
    @media (max-width: 900px) {
      .video-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .video-grid-small {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .video-grid {
        grid-template-columns: 1fr;
      }
      .video-grid-small {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
